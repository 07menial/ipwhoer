name: api-quota-watch
# 每 2 小时看一次 ipx.al 各付费/限额 key 的状态（https://ipx.al/api/quota）。
# 有来源被自动停用（额度用完）就开或更新 issue（GitHub 会通知仓库所有者），全部恢复后自动关闭。
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", R: "${{ github.repository }}" }
    steps:
      - name: check
        run: |
          msg=$(curl -fsSL -A 'Mozilla/5.0 ipx-quota-watch' https://ipx.al/api/quota | python3 -c "
          import json,sys,datetime as dt
          q=json.load(sys.stdin)['sources']; out=[]
          for k,v in q.items():
              i=v.get('pausedInfo') or {}
              if v.get('paused') and i.get('at'):
                  at=dt.datetime.fromisoformat(i['at'].replace('Z','+00:00')).astimezone(dt.timezone(dt.timedelta(hours=8)))
                  out.append(f\"{k}：{at:%m-%d %H:%M} 北京时间发现额度用完（{i.get('why','')[:60]}），已自动切到免 key/跳过，{i.get('until','')[:16]}Z 恢复\")
          print('；'.join(out))") || msg=""
          T="API 额度用完"
          open=$(gh issue list -R $R --state open --search "$T in:title" --json number -q '.[0].number')
          if [ -n "$msg" ]; then
            echo "$msg"
            if [ -z "$open" ]; then gh issue create -R $R -t "$T" -b "$msg"
            elif ! gh issue view "$open" -R $R --json comments,body -q '.body + ([.comments[].body]|join(" "))' | grep -qF "$msg"; then gh issue comment "$open" -R $R -b "$msg"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" -R $R -c "所有 key 已恢复正常。"
          fi
