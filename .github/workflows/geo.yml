name: geo-data
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: python3 build-geo.py geo-data
      - name: publish orphan geo branch
        run: |
          cd geo-data
          cat > README.md <<'MD'
          # ipx.al 国内 IP 库（ip2region 切块）
          每周一由 GitHub Actions 从 ip2region（Apache-2.0，github.com/lionsoul2014/ip2region）源数据重建，只保留最新一份。
          格式见 main 分支 build-geo.py。
          MD
          git init -q -b geo
          git -c user.name=ipx-bot -c user.email=actions@users.noreply.github.com add -A
          git -c user.name=ipx-bot -c user.email=actions@users.noreply.github.com commit -qm "geo data $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" geo
      - name: report failure
        if: failure()
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          T="国内IP库构建失败"
          n=$(gh issue list -R ${{ github.repository }} --state open --search "$T in:title" --json number -q length)
          [ "$n" = "0" ] && gh issue create -R ${{ github.repository }} -t "$T" -b "构建失败：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
